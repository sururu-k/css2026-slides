<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仕様どおりに実装すれば安全か — CSS2026</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/white.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

  <style>
    /* ===== CSS2026 学会標準スタイル（白背景・ネイビー基調） ===== */
    :root {
      --navy: #1a3550;
      --blue: #0369a1;
      --blue-bg: #eef5fb;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d0dbe5;
    }

    .reveal {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", Meiryo, sans-serif;
      font-size: 30px;
      color: var(--text);
    }

    .reveal .slides { text-align: left; }

    /* 見出し */
    .reveal h1 {
      font-size: 1.6em;
      font-weight: 700;
      color: var(--navy);
      text-transform: none;
      line-height: 1.35;
    }
    .reveal h2 {
      font-size: 1.3em;
      font-weight: 700;
      color: var(--navy);
      text-transform: none;
      border-bottom: 3px solid var(--navy);
      padding-bottom: 0.3em;
      margin-bottom: 0.6em;
    }
    .reveal h3 {
      font-size: 0.95em;
      font-weight: 700;
      color: var(--blue);
      text-transform: none;
      margin: 0.7em 0 0.3em;
    }

    /* 本文 */
    .reveal p, .reveal li {
      font-size: 0.82em;
      line-height: 1.6;
    }
    .reveal li { margin-bottom: 0.25em; }
    .reveal li > ul { font-size: 0.9em; color: #374151; }
    .reveal strong { color: var(--navy); }
    .reveal em { color: var(--muted); font-style: normal; }

    /* キーメッセージ（引用ブロック） */
    .reveal blockquote {
      width: 100%;
      margin: 0.7em 0;
      padding: 0.6em 1em;
      background: var(--blue-bg);
      border-left: 6px solid var(--blue);
      border-radius: 4px;
      box-shadow: none;
      font-size: 0.8em;
      line-height: 1.55;
      color: #075985;
    }
    .reveal blockquote p { margin: 0; font-size: inherit; }

    /* テーブル */
    .reveal table { font-size: 0.72em; margin: 0.7em auto; }
    .reveal th { background: #f1f5f9; color: var(--navy); }
    .reveal th, .reveal td { padding: 0.4em 0.8em; border: 1px solid var(--border); }

    /* コード */
    .reveal pre {
      width: 100%;
      margin: 0.6em 0;
      box-shadow: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.55em;
    }
    .reveal pre code { padding: 0.8em 1em; max-height: 420px; }

    /* スライド番号 */
    .reveal .slide-number {
      font-size: 0.55em;
      color: var(--muted);
      background: transparent;
    }

    /* タイトルスライド */
    .reveal .slides section:first-child { text-align: center; }
    .reveal .slides section:first-child h1 { border-bottom: none; }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md"
               data-separator="\r?\n---\r?\n"
               data-separator-notes="^Note:">
      </section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/highlight/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/notes/notes.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/math/math.min.js"></script>
  <script>
    Reveal.initialize({
      width: 1280,
      height: 720,
      margin: 0.04,
      center: true,
      controls: true,
      progress: true,
      slideNumber: 'c/t',
      hash: true,
      transition: 'none',
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX ]
    });
  </script>
</body>
</html>
